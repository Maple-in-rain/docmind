<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocMind 知库 — 知识库问答</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 左侧：文档管理（书房书架） -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-seal">知</span>
      <div class="brand-text">
        <h1>DocMind</h1>
        <p>知库 · 知识问答</p>
      </div>
    </div>

    <label class="upload-zone" for="file-input">
      <span class="upload-plus">＋</span>
      <span class="upload-text">放入文档，纳入知库</span>
      <span class="upload-hint">PDF / Word / Markdown / TXT · ≤20MB</span>
      <input type="file" id="file-input" accept=".pdf,.docx,.md,.markdown,.txt" hidden />
    </label>
    <div class="upload-status" id="upload-status"></div>

    <h2 class="shelf-title">书架 <span id="doc-count-label"></span></h2>
    <ul class="doc-list" id="doc-list"></ul>

    <div class="sidebar-foot">
      <button class="btn-ghost" id="refresh-btn">刷新</button>
      <span class="foot-note">FastAPI + Chroma + DeepSeek</span>
    </div>
  </aside>

  <!-- 右侧：对话区（书页） -->
  <main class="main">
    <button class="sidebar-toggle" id="sidebar-toggle" title="切换书架">☰</button>

    <div class="chat-scroll" id="chat-scroll">
      <div class="welcome" id="welcome">
        <p class="welcome-kicker">以文档为据 · 不凭空作答</p>
        <h2 class="welcome-title">向你的知识库提问</h2>
        <p class="welcome-sub">回答将标注引用来源，点击来源编号可查看原文片段。</p>
        <div class="suggestions" id="suggestions">
          <button class="chip" data-q="什么是检索增强生成">什么是检索增强生成？</button>
          <button class="chip" data-q="奇异值分解有什么应用">奇异值分解有什么应用？</button>
          <button class="chip" data-q="总结一下知识库的主要内容">总结知识库的主要内容</button>
        </div>
      </div>
      <div id="messages"></div>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send-btn" id="send-btn" title="发送">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M2 9l13-6-4.5 12-2.8-5.2L2 9z" stroke="currentColor" stroke-width="1.6"
                stroke-linejoin="round" />
        </svg>
      </button>
    </div>
    <p class="composer-hint">回答由 DeepSeek 生成 · 引用来自你的文档 · 流式输出</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
