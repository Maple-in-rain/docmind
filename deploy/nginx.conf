# DocMind 反向代理（cp 到 /etc/nginx/sites-available/docmind 后软链 sites-enabled）
# 核心：proxy_buffering off —— SSE 流式必须关闭响应缓冲，否则回答被 nginx
# 整段攒在缓冲区，前端收不到逐字流式效果（本项目流式问答的关键体验）。
server {
    listen 80;
    server_name _;                     # 上线时换成域名或公网 IP

    client_max_body_size 25m;          # 与 MAX_UPLOAD_MB=20 匹配

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ---- SSE 流式三件套 ----
        proxy_buffering off;            # 关缓冲：帧到达即转发
        proxy_cache off;
        proxy_read_timeout 300s;        # 长回答流式期间不断连

        proxy_set_header Connection ""; # 复用到上游的 keep-alive，避免每帧重建连接
    }
    # 可选优化（本项目前端零构建、体量小，2C2G 上收益可忽略，故默认交给 uvicorn）：
    # location / { root /home/ubuntu/docmind/frontend; try_files $uri /index.html; }
    # location /api/ { proxy_pass http://127.0.0.1:8000; ...同上 SSE 配置... }
}
